services:
  web:
    build: .
    container_name: mock-ucloud-dev
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      # 源码挂载：改代码即时反映到容器，配合 vite HMR 自动热更新
      - ./:/app
      # node_modules 用匿名卷隔离，避免宿主环境覆盖容器内安装的依赖
      - /app/node_modules
    environment:
      # HMR 的 websocket 回连地址——客户端通过宿主机 5173 建立 ws 连接
      - VITE_HMR_HOST=localhost
      - VITE_HMR_PORT=5173
    restart: unless-stopped
